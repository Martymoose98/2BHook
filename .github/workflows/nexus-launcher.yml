# Uploads a 2B Mod Launcher release (Martymoose98/2B-Mod-Launcher) to the 2BHook Nexus Mods page,
# as a new version of the launcher's file there. Run it from the Actions tab with the launcher's
# tag. The launcher's file is the one on the page with "Launcher" in its name, unless a file id is
# given; the lookup prints the page's files either way.
name: Nexus launcher upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Launcher release tag, e.g. v1.5.1
        required: true
      file_id:
        description: The launcher's Nexus file id (empty finds the file with "Launcher" in its name)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Download the launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo Martymoose98/2B-Mod-Launcher --pattern "2B-Mod-Launcher-$TAG.zip" --dir dist
          ls -l dist

      # The v1 API lists the page's files with their game-scoped ids (NEXUSMODS_MOD_ID is the mod's
      # v3 id, (game id << 32) | mod id). The upload takes the v3 id of the mod file, the chain of
      # versions a file belongs to, which v3 gives for a game-scoped id. The 2BHook file has to come
      # out as NEXUSMODS_FILE_ID that way, or the job stops.
      - name: Find the launcher's Nexus file
        id: file
        env:
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_UID: ${{ vars.NEXUSMODS_MOD_ID }}
          MAIN_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          FILE_ID: ${{ inputs.file_id }}
        shell: python
        run: |
          import json, os, sys, urllib.request

          HEADERS = {'apikey': os.environ['API_KEY'], 'Accept': 'application/json',
                     'User-Agent': '2BHook-release-workflow', 'Application-Name': '2BHook-release-workflow',
                     'Application-Version': '1.0'}

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS)))

          def mod_file_id(game_scoped_id):
              return str(get(f'https://api.nexusmods.com/v3/games/nierautomata/mod-file-versions/{game_scoped_id}')['data']['file']['id'])

          mod_id = int(os.environ['MOD_UID']) & 0xFFFFFFFF
          files = get(f'https://api.nexusmods.com/v1/games/nierautomata/mods/{mod_id}/files.json')['files']

          for f in files:
              print(f"{f['file_id']:>8} | {f.get('category_name')} | {f.get('version')} | {f.get('name')}")

          main = [f for f in files if f.get('category_name') == 'MAIN']

          if len(main) != 1 or mod_file_id(main[0]['file_id']) != os.environ['MAIN_FILE_ID']:
              sys.exit('::error::The main file does not come out as NEXUSMODS_FILE_ID, so the ids found here may not be the ones the upload takes. Give the launcher\'s file id from the Files tab (Advanced).')

          wanted = os.environ.get('FILE_ID', '').strip()

          if wanted:
              print(f'::notice::The launcher\'s file id, as given: {wanted}')
              out_id, category = wanted, 'optional'
          else:
              match = [f for f in files if 'launcher' in (f.get('name') or '').lower()
                       and f.get('category_name') in ('MAIN', 'OPTIONAL', 'MISCELLANEOUS')]

              if len(match) != 1:
                  sys.exit(f'::error::{len(match)} current files have "Launcher" in their name. Run again with the launcher\'s file id.')

              f = match[0]
              out_id = mod_file_id(f['file_id'])
              category = f['category_name'].lower()
              print(f"::notice::The launcher's file: {f.get('name')} {f.get('version')} ({category}, game-scoped {f['file_id']}), file id {out_id}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"id={out_id}\ncategory={category}\nversion={os.environ['TAG'].lstrip('v')}\n")

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.file.outputs.id }}
          filename: dist/2B-Mod-Launcher-${{ env.TAG }}.zip
          version: ${{ steps.file.outputs.version }}
          display_name: 2B Mod Launcher ${{ env.TAG }}
          description: The official 2B Hook launcher. It finds NieR:Automata in any Steam library, starts it (or attaches to it) and loads every DLL in the game's mods folder.
          category: ${{ steps.file.outputs.category }}
          update_mod_version: false
